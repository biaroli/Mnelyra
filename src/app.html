<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #05090e;
        color-scheme: dark;
      }

      #mnelyra-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #05090e;
        opacity: 1;
        transition: opacity 120ms ease-out;
      }

      #mnelyra-boot[data-ready="true"] {
        opacity: 0;
        pointer-events: none;
      }

      .mnelyra-boot-mark {
        display: grid;
        justify-items: center;
        gap: 14px;
        color: #e8eef5;
        font: 600 13px/1 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.34em;
      }

      .mnelyra-boot-line {
        width: 86px;
        height: 1px;
        overflow: hidden;
        background: rgba(232, 238, 245, 0.12);
      }

      .mnelyra-boot-line::after {
        content: "";
        display: block;
        width: 38px;
        height: 1px;
        background: rgba(232, 238, 245, 0.72);
        animation: mnelyra-boot-slide 900ms ease-in-out infinite alternate;
      }

      @keyframes mnelyra-boot-slide {
        from { transform: translateX(-38px); }
        to { transform: translateX(86px); }
      }
    </style>
    <link rel="icon" href="/favicon.png" />
    <title>Mnelyra</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="mnelyra-boot" aria-hidden="true">
      <div class="mnelyra-boot-mark">
        <span>MNELYRA</span>
        <span class="mnelyra-boot-line"></span>
      </div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
